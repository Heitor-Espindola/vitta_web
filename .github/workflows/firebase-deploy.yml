name: Firebase Data Connect Deploy

# Este workflow é executado automaticamente a cada push na branch "main".
# Ele publica o serviço Data Connect no Firebase ANTES que o Railway
# processe o mesmo push e realize o deploy da aplicação, garantindo que
# o backend de dados esteja sempre atualizado antes do deploy do app.
on:
  push:
    branches:
      - main

jobs:
  firebase-dataconnect-deploy:
    name: Deploy Firebase Data Connect
    runs-on: ubuntu-latest

    steps:
      # 1. Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instala o Node.js (versão LTS)
      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # 3. Instala as dependências do projeto (o repositório usa npm,
      #    conforme indicado pelo package-lock.json)
      - name: Install dependencies
        run: npm ci

      # 4. Instala a Firebase CLI globalmente
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 5. Executa o deploy do Data Connect autenticando com o token
      #    armazenado no GitHub Secret "FIREBASE_TOKEN".
      #
      #    Como configurar o secret:
      #      1. Gere um token de CI executando localmente:
      #         firebase login:ci
      #      2. No GitHub, vá em:
      #         Settings > Secrets and variables > Actions > New repository secret
      #      3. Nome do secret: FIREBASE_TOKEN
      #      4. Valor: o token gerado pelo comando acima
      - name: Deploy Firebase Data Connect
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only dataconnect:vitta-5ec1e-service:example --token "$FIREBASE_TOKEN"

      # 6. Se o deploy do Firebase for bem-sucedido, o job termina com
      #    sucesso e o push segue seu fluxo normal, permitindo que o
      #    Railway (que também está observando pushes na branch "main")
      #    prossiga com o deploy da aplicação normalmente.
      - name: Confirm successful Firebase deploy
        if: success()
        run: echo "Firebase Data Connect deploy concluído com sucesso. O Railway prosseguirá com o deploy da aplicação."
