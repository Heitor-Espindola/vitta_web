# ============================================================
# APPOINTMENTS
# ============================================================
mutation CreateAppointment(
  $patientId: UUID!
  $vaccineId: UUID!
  $ubsId: UUID
  $createdAt: Timestamp!
  $scheduledAt: Timestamp!
  $status: AppointmentStatus!
  $notes: String
) @auth(level: USER) @transaction {
  query @redact {
    users(
      where: {
        _and: [
          { authUid: { eq_expr: "auth.uid" } }
          { portalRole: { eq: PROFESSIONAL } }
        ]
      }
    ) @check(message: "Ação restrita a profissional autenticado.") {
      id
    }
    patientAccess(
      key: { granteeAuthUid_expr: "auth.uid", patientId: $patientId }
    ) {
      accessKind
        @check(
          expr: "this == 'PROFESSIONAL'"
          message: "Grant profissional obrigatório."
        )
      consentStatus
        @check(expr: "this == 'GRANTED'", message: "Acesso não concedido.")
      viewVaccination
        @check(expr: "this == true", message: "Agenda não autorizada.")
      validUntil
        @check(
          expr: "this == null || this > request.time"
          message: "Acesso expirado."
        )
    }
  }
  appointment_insert(
    data: {
      patientId: $patientId
      vaccineId: $vaccineId
      ubsId: $ubsId
      createdAt: $createdAt
      scheduledAt: $scheduledAt
      status: $status
      notes: $notes
    }
  )
}
mutation UpdateAppointment(
  $id: UUID!
  $patientId: UUID
  $vaccineId: UUID
  $ubsId: UUID
  $createdAt: Timestamp
  $scheduledAt: Timestamp
  $status: AppointmentStatus
  $notes: String
) @auth(expr: "auth.token.admin == true") {
  appointment_update(
    id: $id
    data: {
      patientId: $patientId
      vaccineId: $vaccineId
      ubsId: $ubsId
      createdAt: $createdAt
      scheduledAt: $scheduledAt
      status: $status
      notes: $notes
    }
  )
}
mutation DeleteAppointment($id: UUID!)
  @auth(expr: "auth.token.admin == true") {
  appointment_delete(id: $id)
}

# ============================================================
# APPLICATIONS
# ============================================================
mutation CreateApplication(
  $patientId: UUID!
  $vaccineId: UUID!
  $batchId: UUID
  $appointmentId: UUID
  $professionalId: UUID!
  $ubsId: UUID!
  $applicationDate: Timestamp!
  $doseNumber: Int
  $notes: String
) @auth(level: USER) @transaction {
  query @redact {
    professional(id: $professionalId)
      @check(message: "Profissional não encontrado.") {
      active
        @check(
          expr: "this == true"
          message: "Profissional inativo ou arquivado."
        )
      professionalRegistration
      user {
        name
        authUid
          @check(
            expr: "this == auth.uid"
            message: "O profissional deve corresponder ao usuário autenticado."
          )
        portalRole
          @check(
            expr: "this == 'PROFESSIONAL'"
            message: "Papel profissional obrigatório."
          )
      }
    }
    patient(id: $patientId) @check(message: "Paciente não encontrado.") {
      active
        @check(
          expr: "this == true"
          message: "Paciente inativo ou arquivado."
        )
      legacyPersonId
      user {
        name
      }
    }
    vaccine(id: $vaccineId) @check(message: "Vacina não encontrada.") {
      active
        @check(
          expr: "this == true"
          message: "Vacina inativa ou arquivada."
        )
      name
    }
    uBS(id: $ubsId) @check(message: "UBS não encontrada.") {
      active
        @check(expr: "this == true", message: "UBS inativa ou arquivada.")
      name
    }
    batch(id: $batchId) @check(optional: true) {
      manufacturer
      batchCode
      vaccine {
        id
          @check(
            expr: "this == vars.vaccineId"
            message: "O lote não pertence à vacina informada."
          )
      }
    }
    patientAccess(
      key: { granteeAuthUid_expr: "auth.uid", patientId: $patientId }
    ) {
      accessKind
        @check(
          expr: "this == 'PROFESSIONAL'"
          message: "Grant profissional obrigatório."
        )
      consentStatus
        @check(expr: "this == 'GRANTED'", message: "Acesso não concedido.")
      viewVaccination
        @check(expr: "this == true", message: "Carteira não autorizada.")
      validUntil
        @check(
          expr: "this == null || this > request.time"
          message: "Acesso expirado."
        )
    }
  }
  application_insert(
    data: {
      patientId: $patientId
      vaccineId: $vaccineId
      batchId: $batchId
      appointmentId: $appointmentId
      professionalId: $professionalId
      ubsId: $ubsId
      applicationDate: $applicationDate
      doseNumber: $doseNumber
      patientIdSnapshot: $patientId
      patientLegacyPersonIdSnapshot_expr: "response.query.patient.legacyPersonId"
      patientNameSnapshot_expr: "response.query.patient.user.name"
      vaccineNameSnapshot_expr: "response.query.vaccine.name"
      lotSnapshot_expr: "response.query.batch.batchCode"
      manufacturerSnapshot_expr: "response.query.batch.manufacturer"
      facilityNameSnapshot_expr: "response.query.uBS.name"
      professionalNameSnapshot_expr: "response.query.professional.user.name"
      professionalRegistrationSnapshot_expr: "response.query.professional.professionalRegistration"
      source: "WEB_PORTAL"
      notes: $notes
      createdAt_expr: "request.time"
      updatedAt_expr: "request.time"
    }
  )
}
mutation UpdateApplication(
  $id: UUID!
  $doseNumber: Int
  $doseLabel: String
  $nextDoseAt: Timestamp
  $notes: String
) @auth(expr: "auth.token.admin == true") @transaction {
  application_update(
    id: $id
    data: {
      doseNumber: $doseNumber
      doseLabel: $doseLabel
      nextDoseAt: $nextDoseAt
      notes: $notes
      updatedAt_expr: "request.time"
    }
  ) @check(message: "Aplicação não encontrada.")
}
mutation VoidApplication($id: UUID!, $reason: String!)
  @auth(expr: "auth.token.admin == true")
  @transaction {
  application_update(
    id: $id
    data: {
      voidedAt_expr: "request.time"
      voidedByAuthUid_expr: "auth.uid"
      voidReason: $reason
      updatedAt_expr: "request.time"
    }
  ) @check(message: "Aplicação não encontrada.")
}
