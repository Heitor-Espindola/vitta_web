# ============================================================
# USERS
# ============================================================
mutation CreateUser(
  $name: String!
  $birthDate: Date!
  $email: String!
  $status: UserStatus!
  $cpf: String!
  $sex: String
) @auth(expr: "auth.token.admin == true") {
  user_insert(
    data: {
      name: $name
      birthDate: $birthDate
      email: $email
      status: $status
      cpf: $cpf
      sex: $sex
    }
  )
}
mutation UpdateUser(
  $id: UUID!
  $name: String
  $birthDate: Date
  $email: String
  $status: UserStatus
  $cpf: String
  $sex: String
) @auth(expr: "auth.token.admin == true") {
  user_update(
    id: $id
    data: {
      name: $name
      birthDate: $birthDate
      email: $email
      status: $status
      cpf: $cpf
      sex: $sex
    }
  )
}
mutation DeleteUnlinkedUser($id: UUID!)
  @auth(expr: "auth.token.admin == true")
  @transaction {
  query @redact {
    patients(where: { userId: { eq: $id } })
      @check(
        expr: "this.size() == 0"
        message: "Usuário vinculado a paciente não pode ser excluído."
      ) {
      id
    }
    professionals(where: { userId: { eq: $id } })
      @check(
        expr: "this.size() == 0"
        message: "Usuário vinculado a profissional não pode ser excluído."
      ) {
      id
    }
  }
  user_delete(id: $id) @check(message: "Usuário não encontrado.")
}

# ============================================================
# PATIENTS
# ============================================================
mutation CreatePatient(
  $userId: UUID!
  $patientType: PatientType!
  $responsibleId: UUID
  $motherName: String
) @auth(expr: "auth.token.admin == true") {
  patient_insert(
    data: {
      userId: $userId
      patientType: $patientType
      responsibleId: $responsibleId
      motherName: $motherName
    }
  )
}
mutation UpdatePatient(
  $id: UUID!
  $patientType: PatientType
  $responsibleId: UUID
  $motherName: String
) @auth(expr: "auth.token.admin == true") {
  patient_update(
    id: $id
    data: {
      patientType: $patientType
      responsibleId: $responsibleId
      motherName: $motherName
    }
  )
}
mutation ArchivePatient($id: UUID!)
  @auth(expr: "auth.token.admin == true")
  @transaction {
  patient_update(
    id: $id
    data: {
      active: false
      archivedAt_expr: "request.time"
      archivedByAuthUid_expr: "auth.uid"
    }
  ) @check(message: "Paciente não encontrado.")
}

