# ============================================================
# APPOINTMENTS
# ============================================================
mutation CreateAppointment(
  $patientId: UUID!
  $vaccineId: UUID!
  $ubsId: UUID
  $createdAt: Timestamp!
  $scheduledAt: Timestamp!
  $status: AppointmentStatus!
  $notes: String
) @auth(level: USER) @transaction {
  query @redact {
    users(
      where: {
        _and: [
          { authUid: { eq_expr: "auth.uid" } }
          { portalRole: { eq: PROFESSIONAL } }
        ]
      }
    ) @check(message: "Ação restrita a profissional autenticado.") {
      id
    }
    patientAccess(
      key: { granteeAuthUid_expr: "auth.uid", patientId: $patientId }
    ) {
      accessKind
        @check(
          expr: "this == 'PROFESSIONAL'"
          message: "Grant profissional obrigatório."
        )
      consentStatus
        @check(expr: "this == 'GRANTED'", message: "Acesso não concedido.")
      viewVaccination
        @check(expr: "this == true", message: "Agenda não autorizada.")
      validUntil
        @check(
          expr: "this == null || this > request.time"
          message: "Acesso expirado."
        )
    }
  }
  appointment_insert(
    data: {
      patientId: $patientId
      vaccineId: $vaccineId
      ubsId: $ubsId
      createdAt: $createdAt
      scheduledAt: $scheduledAt
      status: $status
      notes: $notes
    }
  )
}
mutation UpdateAppointment(
  $id: UUID!
  $patientId: UUID
  $vaccineId: UUID
  $ubsId: UUID
  $createdAt: Timestamp
  $scheduledAt: Timestamp
  $status: AppointmentStatus
  $notes: String
) @auth(expr: "auth.token.admin == true") {
  appointment_update(
    id: $id
    data: {
      patientId: $patientId
      vaccineId: $vaccineId
      ubsId: $ubsId
      createdAt: $createdAt
      scheduledAt: $scheduledAt
      status: $status
      notes: $notes
    }
  )
}
mutation DeleteAppointment($id: UUID!)
  @auth(expr: "auth.token.admin == true") {
  appointment_delete(id: $id)
}

# ============================================================
# APPLICATIONS
# ============================================================
mutation CreateApplication(
  $patientId: UUID!
  $vaccineId: UUID!
  $batchId: UUID
  $appointmentId: UUID
  $professionalId: UUID!
  $ubsId: UUID!
  $applicationDate: Timestamp!
  $doseNumber: Int
  $notes: String
) @auth(level: USER) @transaction {
  query @redact {
    professional(id: $professionalId)
      @check(message: "Profissional não encontrado.") {
      user {
        authUid
          @check(
            expr: "this == auth.uid"
            message: "O profissional deve corresponder ao usuário autenticado."
          )
        portalRole
          @check(
            expr: "this == 'PROFESSIONAL'"
            message: "Papel profissional obrigatório."
          )
      }
    }
    patientAccess(
      key: { granteeAuthUid_expr: "auth.uid", patientId: $patientId }
    ) {
      accessKind
        @check(
          expr: "this == 'PROFESSIONAL'"
          message: "Grant profissional obrigatório."
        )
      consentStatus
        @check(expr: "this == 'GRANTED'", message: "Acesso não concedido.")
      viewVaccination
        @check(expr: "this == true", message: "Carteira não autorizada.")
      validUntil
        @check(
          expr: "this == null || this > request.time"
          message: "Acesso expirado."
        )
    }
  }
  application_insert(
    data: {
      patientId: $patientId
      vaccineId: $vaccineId
      batchId: $batchId
      appointmentId: $appointmentId
      professionalId: $professionalId
      ubsId: $ubsId
      applicationDate: $applicationDate
      doseNumber: $doseNumber
      notes: $notes
    }
  )
}
mutation UpdateApplication(
  $id: UUID!
  $patientId: UUID
  $vaccineId: UUID
  $batchId: UUID
  $appointmentId: UUID
  $professionalId: UUID
  $ubsId: UUID
  $applicationDate: Timestamp
  $doseNumber: Int
  $notes: String
) @auth(expr: "auth.token.admin == true") {
  application_update(
    id: $id
    data: {
      patientId: $patientId
      vaccineId: $vaccineId
      batchId: $batchId
      appointmentId: $appointmentId
      professionalId: $professionalId
      ubsId: $ubsId
      applicationDate: $applicationDate
      doseNumber: $doseNumber
      notes: $notes
    }
  )
}
mutation DeleteApplication($id: UUID!)
  @auth(expr: "auth.token.admin == true") {
  application_delete(id: $id)
}
