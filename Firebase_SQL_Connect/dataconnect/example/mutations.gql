# ============================================================
# USERS
# ============================================================
mutation CreateUser(
  $name: String!
  $birthDate: Date!
  $email: String!
  $status: UserStatus!
  $cpf: String!
  $sex: String
) @auth(expr: "auth.token.admin == true") {
  user_insert(
    data: {
      name: $name
      birthDate: $birthDate
      email: $email
      status: $status
      cpf: $cpf
      sex: $sex
    }
  )
}
mutation UpdateUser(
  $id: UUID!
  $name: String
  $birthDate: Date
  $email: String
  $status: UserStatus
  $cpf: String
  $sex: String
) @auth(expr: "auth.token.admin == true") {
  user_update(
    id: $id
    data: {
      name: $name
      birthDate: $birthDate
      email: $email
      status: $status
      cpf: $cpf
      sex: $sex
    }
  )
}
mutation DeleteUser($id: UUID!) @auth(expr: "auth.token.admin == true") {
  user_delete(id: $id)
}

