query ListApplicationsByVaccine($vaccineId: UUID!)
  @auth(expr: "auth.token.admin == true")
  @refresh(onMutationExecuted: { operation: "CreateUser" })
  @refresh(onMutationExecuted: { operation: "UpdateUser" })
  @refresh(onMutationExecuted: { operation: "DeleteUnlinkedUser" })
  @refresh(onMutationExecuted: { operation: "CreateProfessional" })
  @refresh(onMutationExecuted: { operation: "UpdateProfessional" })
  @refresh(onMutationExecuted: { operation: "ArchiveProfessional" })
  @refresh(onMutationExecuted: { operation: "CreateUbs" })
  @refresh(onMutationExecuted: { operation: "UpdateUbs" })
  @refresh(onMutationExecuted: { operation: "ArchiveUbs" })
  @refresh(onMutationExecuted: { operation: "CreateVaccine" })
  @refresh(onMutationExecuted: { operation: "UpdateVaccine" })
  @refresh(onMutationExecuted: { operation: "ArchiveVaccine" })
  @refresh(onMutationExecuted: { operation: "CreateBatch" })
  @refresh(onMutationExecuted: { operation: "UpdateBatch" })
  @refresh(onMutationExecuted: { operation: "DeleteBatch" })
  @refresh(onMutationExecuted: { operation: "CreateApplication" })
  @refresh(onMutationExecuted: { operation: "UpdateApplication" })
  @refresh(onMutationExecuted: { operation: "VoidApplication" })
  @refresh(onMutationExecuted: { operation: "VoidLegacyApplication" }) {
  applications(where: { vaccineId: { eq: $vaccineId } }) {
    id
    patientIdSnapshot
    patientLegacyPersonIdSnapshot
    patientNameSnapshot
    vaccineNameSnapshot
    facilityNameSnapshot
    professionalNameSnapshot
    professionalRegistrationSnapshot
    voidedAt
    voidReason
    patient {
