# ============================================================
# USERS
# ============================================================

query ListUsers
  @auth(expr: "auth.token.admin == true")
  @refresh(onMutationExecuted: { operation: "CreateUser" })
  @refresh(onMutationExecuted: { operation: "UpdateUser" })
  @refresh(onMutationExecuted: { operation: "DeleteUser" }) {
  users {
    id
    name
    birthDate
    email
    status
    cpf
    sex
  }
}

query GetUser($id: UUID!) @auth(expr: "auth.token.admin == true") {
  user(id: $id) {
    id
    name
    birthDate
    email
    status
    cpf
    sex
  }
}

query GetUserByCpf($cpf: String!) @auth(level: USER) {
  professionals(where: { user: { authUid: { eq_expr: "auth.uid" } } })
    @redact
    @check(message: "Acesso restrito ao portal profissional.") {
    id
  }
  users(where: { cpf: { eq: $cpf } }) {
    id
    name
    birthDate
    email
    status
    cpf
    sex
  }
}

query GetUserByEmail($email: String!) @auth(expr: "auth.token.admin == true") {
  users(where: { email: { eq: $email } }) {
    id
    name
    birthDate
    email
    status
    cpf
    sex
  }
}

# ============================================================
# PATIENTS
# ============================================================

query ListPatients
  @auth(expr: "auth.token.admin == true")
  @refresh(onMutationExecuted: { operation: "CreateUser" })
  @refresh(onMutationExecuted: { operation: "UpdateUser" })
  @refresh(onMutationExecuted: { operation: "DeleteUser" })
  @refresh(onMutationExecuted: { operation: "CreatePatient" })
  @refresh(onMutationExecuted: { operation: "UpdatePatient" })
  @refresh(onMutationExecuted: { operation: "DeletePatient" }) {
  patients {
    id
    motherName
    user {
      id
      name
      birthDate
      email
      cpf
      sex
      status
    }
    patientType
    responsible {
      id
      user {
        id
        name
        cpf
      }
    }
  }
}

query GetPatient($id: UUID!) @auth(level: USER) {
  patientAccess(key: { granteeAuthUid_expr: "auth.uid", patientId: $id })
    @redact {
    consentStatus
      @check(expr: "this == 'GRANTED'", message: "Acesso não concedido.")
    viewProfile
      @check(expr: "this == true", message: "Perfil não autorizado.")
    validUntil
      @check(
        expr: "this == null || this > request.time"
        message: "Acesso expirado."
      )
  }
  patient(id: $id) {
    id
    motherName
    user {
      id
      name
      birthDate
      email
      cpf
      sex
      status
    }
    patientType
    responsible {
      id
      user {
        id
        name
        cpf
      }
    }
  }
}

query GetPatientByUser($userId: UUID!)
  @auth(expr: "auth.token.admin == true") {
  patients(where: { userId: { eq: $userId } }) {
    id
    motherName
    user {
      id
      name
      birthDate
      email
      cpf
      sex
      status
    }
    patientType
    responsible {
      id
      user {
        id
        name
        cpf
      }
    }
  }
}

# ============================================================
# UBS
# ============================================================

query ListUbs
  @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "CreateUbs" })
  @refresh(onMutationExecuted: { operation: "UpdateUbs" })
  @refresh(onMutationExecuted: { operation: "DeleteUbs" }) {
  users(
    where: {
      _and: [
        { authUid: { eq_expr: "auth.uid" } }
        {
          _or: [
            { portalRole: { eq: PROFESSIONAL } }
            { portalRole: { eq: ADMIN } }
          ]
        }
      ]
    }
  ) @redact @check(message: "Acesso restrito ao portal profissional.") {
    id
  }
  uBSs {
    id
    name
    logradouro
    numero
    bairro
    cidade
    cep
  }
}

query GetUbs($id: UUID!) @auth(level: USER) {
  users(where: { authUid: { eq_expr: "auth.uid" } })
    @redact
    @check(message: "Conta autenticada não vinculada ao SQL.") {
    id
  }
  uBS(id: $id) {
    id
    name
    logradouro
    numero
    bairro
    cidade
    cep
  }
}

query SearchUbsByName($name: String!) @auth(level: USER) {
  users(where: { authUid: { eq_expr: "auth.uid" } })
    @redact
    @check(message: "Conta autenticada não vinculada ao SQL.") {
    id
  }
  uBSs(where: { name: { contains: $name } }) {
    id
    name
    logradouro
    numero
    bairro
    cidade
    cep
  }
}

