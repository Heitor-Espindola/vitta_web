# ============================================================

query ListPatients
  @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "CreateUser" })
  @refresh(onMutationExecuted: { operation: "UpdateUser" })
  @refresh(onMutationExecuted: { operation: "DeleteUser" })
  @refresh(onMutationExecuted: { operation: "CreatePatient" })
  @refresh(onMutationExecuted: { operation: "UpdatePatient" })
  @refresh(onMutationExecuted: { operation: "DeletePatient" }) {
  patients {
    id
    motherName
    user {
      id
      name
      birthDate
      email
      cpf
      sex
      status
    }
    patientType
    responsible {
      id
      user {
        id
        name
        cpf
      }
    }
  }
}

