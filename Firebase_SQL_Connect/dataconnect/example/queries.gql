# ============================================================
# USERS
# ============================================================

query ListUsers
  @auth(expr: "auth.token.admin == true")
  @refresh(onMutationExecuted: { operation: "CreateUser" })
  @refresh(onMutationExecuted: { operation: "UpdateUser" })
  @refresh(onMutationExecuted: { operation: "DeleteUnlinkedUser" }) {
  users {
    id
    name
    birthDate
    email
    status
    cpf
    sex
  }
}

query GetUser($id: UUID!) @auth(expr: "auth.token.admin == true") {
  user(id: $id) {
    id
    name
    birthDate
    email
    status
    cpf
    sex
    phone
  }
}

query GetCurrentPortalUser @auth(level: USER) {
  users(where: { authUid: { eq_expr: "auth.uid" } }) {
    id
    name
    birthDate
    email
    authUid
    status
    cpf
    sex
    phone
    photoUrl
    portalRole
    professional_on_user {
      id
      active
      professionalType
      professionalRegistration
      ubs {
        id
        name
      }
    }
  }
}

# Compatibilidade temporária para versões antigas do SDK. A operação foi
# retirada do SDK novo e restringida a administrador para não manter a busca
# global por CPF disponível ao papel profissional.
query GetUserByCpf($cpf: String!)
  @auth(expr: "auth.token.admin == true")
  @retired {
  professionals(where: { user: { authUid: { eq_expr: "auth.uid" } } })
    @retired
    @redact
    @check(message: "Acesso restrito ao portal profissional.") {
    id
  }
  users(where: { cpf: { eq: $cpf } }) {
    id
    name
    birthDate
    email
    status
    cpf
    sex
  }
}

query GetAdminPatientByCpf($cpf: String!)
  @auth(expr: "auth.token.admin == true") {
  patients(
    where: {
      _and: [
        { active: { eq: true } }
        { user: { cpf: { eq: $cpf } } }
      ]
    }
  ) {
    id
    motherName
    patientType
    user {
      id
      name
      birthDate
      email
      cpf
      sex
      status
    }
    responsible {
      id
      user {
        id
        name
        cpf
      }
    }
  }
}

query GetUserByEmail($email: String!) @auth(expr: "auth.token.admin == true") {
  users(where: { email: { eq: $email } }) {
    id
    name
    birthDate
    email
    status
    cpf
    sex
  }
}

