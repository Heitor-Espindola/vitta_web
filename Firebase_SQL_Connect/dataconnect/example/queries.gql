        { consentStatus: { eq: GRANTED } }
        { viewProfile: { eq: true } }
        { patient: { active: { eq: true }, user: { cpf: { eq: $cpf } } } }
        {
          _or: [
            { validUntil: { isNull: true } }
            { validUntil: { gt_expr: "request.time" } }
          ]
        }
      ]
    }
  ) {
    patient {
      id
      motherName
      patientType
      user {
        id
        name
        birthDate
        email
        cpf
        sex
        status
      }
      responsible {
        id
        user {
          id
          name
          cpf
        }
      }
    }
  }
}

query GetPatient($id: UUID!) @auth(level: USER) {
  patientAccess(key: { granteeAuthUid_expr: "auth.uid", patientId: $id })
    @redact {
    consentStatus
      @check(expr: "this == 'GRANTED'", message: "Acesso não concedido.")
    viewProfile
      @check(expr: "this == true", message: "Perfil não autorizado.")
    validUntil
      @check(
        expr: "this == null || this > request.time"
        message: "Acesso expirado."
      )
  }
  patient(id: $id) {
    id
    motherName
    user {
      id
      name
      birthDate
      email
      cpf
      sex
      status
    }
    patientType
    responsible {
      id
      user {
        id
        name
        cpf
      }
    }
  }
}

