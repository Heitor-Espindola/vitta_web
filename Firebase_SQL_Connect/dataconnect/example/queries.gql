  @refresh(onMutationExecuted: { operation: "UpdateUser" })
  @refresh(onMutationExecuted: { operation: "DeleteUnlinkedUser" })
  @refresh(onMutationExecuted: { operation: "CreatePatient" })
  @refresh(onMutationExecuted: { operation: "UpdatePatient" })
  @refresh(onMutationExecuted: { operation: "ArchivePatient" }) {
  patients(where: { active: { eq: true } }) {
    id
    motherName
    user {
      id
      name
      birthDate
      email
      cpf
      sex
      status
    }
    patientType
    responsible {
      id
      user {
        id
        name
        cpf
      }
    }
  }
}

query ListAccessiblePatients @auth(level: USER) {
  users(
    where: {
      _and: [
        { authUid: { eq_expr: "auth.uid" } }
        { portalRole: { eq: PROFESSIONAL } }
      ]
    }
  ) @redact @check(message: "Acesso restrito ao portal profissional.") {
    id
  }
  patientAccesses(
    where: {
      _and: [
        { granteeAuthUid: { eq_expr: "auth.uid" } }
        { accessKind: { eq: PROFESSIONAL } }
        { consentStatus: { eq: GRANTED } }
        { viewProfile: { eq: true } }
        { patient: { active: { eq: true } } }
        {
          _or: [
            { validUntil: { isNull: true } }
            { validUntil: { gt_expr: "request.time" } }
          ]
        }
      ]
    }
  ) {
    patient {
      id
      motherName
      patientType
      user {
        id
        name
        birthDate
        email
        cpf
        sex
        status
      }
      responsible {
        id
        user {
          id
          name
          cpf
        }
      }
    }
  }
}

