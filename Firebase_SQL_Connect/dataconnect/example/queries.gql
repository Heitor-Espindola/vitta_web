# ============================================================
# USERS
# ============================================================

query ListUsers
  @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "CreateUser" })
  @refresh(onMutationExecuted: { operation: "UpdateUser" })
  @refresh(onMutationExecuted: { operation: "DeleteUser" }) {
  users {
    id
    name
    birthDate
    email
    status
    cpf
    sex
  }
}

query GetUser($id: UUID!) @auth(level: USER) {
  user(id: $id) {
    id
    name
    birthDate
    email
    status
    cpf
    sex
  }
}

query GetUserByCpf($cpf: String!) @auth(level: USER) {
  users(where: { cpf: { eq: $cpf } }) {
    id
    name
    birthDate
    email
    status
    cpf
    sex
  }
}

query GetUserByEmail($email: String!) @auth(level: USER) {
  users(where: { email: { eq: $email } }) {
    id
    name
    birthDate
    email
    status
    cpf
    sex
  }
}

